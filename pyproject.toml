[project]
name = "chaouch"
version = "0.1.0"
description = "A Tunisian Derja assistant for administrative procedures, with measured quality."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx2>=2.13.1",
    "openai>=3.28.0",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PTH enforces pathlib (spec 3.1.1: never hard-code path separators).
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
strict = true
files = ["src", "tasks.py"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls real LLM providers; opt-in via `uv run tasks.py test-live`"]
addopts = "-m 'not live'"
