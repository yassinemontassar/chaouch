# Services that are easier in containers (spec 3.1.1). Start only what the task needs:
#   uv run tasks.py db-up        (= docker compose --profile core up -d db)
# The API and MCP server join the `core` profile in later phases.

services:
  db:
    image: pgvector/pgvector:pg16
    profiles: [core]
    environment:
      POSTGRES_USER: chaouch
      POSTGRES_DB: chaouch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"  # local only
    volumes:
      - chaouch_pgdata:/var/lib/postgresql/data  # named volume, not a bind mount from C:\
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaouch -d chaouch"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  chaouch_pgdata:
