# LLM providers and models. All three expose OpenAI-compatible endpoints.
# Free-tier limits change often: check the provider's limits page before a big run
# and update rpm/rpd here (never in code). Checked 2026-10-11 from 429 messages and Groq's
# x-ratelimit-* headers.

providers:
  ollama:
    base_url: http://localhost:11434/v1
    api_key_env: null
    rpm: 600
    rpd: null
    timeout_s: 180
    max_retries: 1
    concurrency: 1  # one GPU, one loaded model (OLLAMA_MAX_LOADED_MODELS=1)
  gemini:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    api_key_env: GEMINI_API_KEY
    # gemini-3.5-flash-lite free tier, from the owner's AI Studio console on 2026-10-11 (ADR 0008).
    # Gemini limits are per model: re-check them if another Gemini model is added.
    rpm: 15
    rpd: 500
    timeout_s: 60
    max_retries: 4
    concurrency: 2
  # Groq limits are per model, so each Groq model gets its own entry (and its own limiter).
  # Tokens per minute is the binding limit; rpm is derived from it.
  groq:  # judge: openai/gpt-oss-120b, 8000 tokens/min at ~2100 tokens per judge call
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 3
    rpd: 1000
    timeout_s: 60
    max_retries: 4
    concurrency: 1
  groq_allam:  # allam-2-7b, 6000 tokens/min with ~2500-token oracle prompts
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    rpm: 2
    rpd: 7000
    timeout_s: 60
    max_retries: 4
    concurrency: 1

# Keys are referenced from configs/eval.yaml (spec 3.1.2 and 5.1).
# `params` are extra request fields sent with every call to that model.
models:
  qwen3_5_2b:
    provider: ollama
    name: qwen3.5:2b
    params:
      reasoning_effort: none  # Ollama maps this to think=false
  falcon_h1_3b:  # stand-in for Falcon-H1 Arabic 3B, which has no public weights (ADR 0005)
    provider: ollama
    name: hf.co/tiiuae/Falcon-H1-3B-Instruct-GGUF:Q4_K_M
  gemini_flash_lite:
    provider: gemini
    name: gemini-3.5-flash-lite  # gemini-2.5-flash allows only 20 requests/day (ADR 0008)
  allam_2_7b:
    provider: groq_allam
    name: allam-2-7b  # 4096-token context on Groq
  groq_judge:
    provider: groq
    name: openai/gpt-oss-120b  # a different family from every evaluated model (ADR 0002)
